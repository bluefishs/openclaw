services:
  ollama:
    image: ollama/ollama:latest

    # Security hardening
    security_opt:
      - no-new-privileges:true

    volumes:
      - ollama_data:/root/.ollama

    # Resource limits for LLM
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
        reservations:
          memory: 4G

    # Health check
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - openclaw-net

    restart: unless-stopped

  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    depends_on:
      ollama:
        condition: service_healthy
      openclaw-browser:
        condition: service_healthy

    # Security hardening (OWASP A02:2025 - Security Misconfiguration)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Temporary directories
    tmpfs:
      - /tmp:mode=1777,size=500M

    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      # Session keys removed — use openclaw config or .env if needed
      OLLAMA_HOST: http://ollama:11434
      # Enable Docker relay mode for Chrome extension
      OPENCLAW_RELAY_DOCKER: "true"
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      ## Uncomment the lines below to enable sandbox isolation
      ## (agents.defaults.sandbox). Requires Docker CLI in the image
      ## (build with --build-arg OPENCLAW_INSTALL_DOCKER_CLI=1) or use
      ## scripts/docker/setup.sh with OPENCLAW_SANDBOX=1 for automated setup.
      ## Set DOCKER_GID to the host's docker group GID (run: stat -c '%g' /var/run/docker.sock).
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"
    ports:
      # Gateway API — loopback + LAN (set OPENCLAW_LAN_IP in .env for LAN access)
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_LAN_IP:-127.0.0.1}:${OPENCLAW_LAN_PORT:-18889}:18789"
      # Bridge
      - "127.0.0.1:${OPENCLAW_BRIDGE_PORT:-18790}:18790"
      # Browser Relay (CDP)
      - "127.0.0.1:18792:18792"

    # Resource limits (prevent DoS)
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4"
        reservations:
          memory: 1G

    # Logging configuration (OWASP A09:2025 - Security Logging)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # DNS optimization for WSL2 (fixes Telegram polling timeout)
    dns:
      - 8.8.8.8
      - 1.1.1.1

    networks:
      - openclaw-net

    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-loopback}",
        "--port",
        "18789",
        "--allow-unconfigured",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    network_mode: "service:openclaw-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=500M
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      BROWSER: echo
      # Session keys removed — use openclaw config or .env if needed
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - openclaw_agents:/home/node/.openclaw/agents

    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway

  # Headless Chrome browser for automated browsing
  openclaw-browser:
    build:
      context: .
      dockerfile: Dockerfile.sandbox-browser
    image: openclaw-browser:local

    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    environment:
      OPENCLAW_BROWSER_HEADLESS: "1"
      OPENCLAW_BROWSER_CDP_PORT: "9222"
      OPENCLAW_BROWSER_ENABLE_NOVNC: "0"

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 512M

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-sS", "http://127.0.0.1:9222/json/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      openclaw-net:
        ipv4_address: 172.28.0.10

    restart: unless-stopped

networks:
  openclaw-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  ollama_data:
  openclaw_agents:
